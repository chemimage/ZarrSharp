[project]
name = "zarr-examples"
version = "0.1.0"
description = "Python readback environment for Zarr examples"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2",
  "scikit-image>=0.24",
  "zarr",
]

[dependency-groups]
dev = [
  "pytest>=8",
]

[tool.uv]
package = false

[tool.uv.sources]
zarr = { path = "../reference/zarr-python-main", editable = true }
